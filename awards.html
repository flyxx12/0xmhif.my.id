.archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.document-card{appearance:none;text-align:left;color:inherit;text-decoration:none;background:linear-gradient(145deg,#12363a,#08272c);border:1px solid #a9c8bb28;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .22s,border-color .22s,background .22s;cursor:pointer;padding:0}.document-card:hover,.document-card:focus-visible{transform:translateY(-4px);border-color:#8db5a5a0;background:linear-gradient(145deg,#174146,#092a30);outline:none}.document-preview{height:225px;background:#e9e7df;display:flex;align-items:center;justify-content:center;position:relative;padding:15px;overflow:hidden}.document-preview img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 8px 25px #00151924;transition:transform .25s}.document-card:hover .document-preview img{transform:scale(1.025)}.document-type{position:absolute;top:12px;left:12px;background:#08272ce8;color:#bcd2c7;padding:6px 8px;font:8px 'IBM Plex Mono',monospace;letter-spacing:.08em}.document-info{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}.document-kicker{font:9px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#f97751}.document-info h2{font:500 19px 'Space Grotesk',sans-serif;letter-spacing:-.025em;margin:0}.document-info p{font-size:11px;line-height:1.7;color:#a9c0b7;margin:0}.document-bottom{border-top:1px solid #b8d2c61e;padding:12px 18px;display:flex;justify-content:space-between;color:#91aea3;font:8px 'IBM Plex Mono',monospace;letter-spacing:.08em}.document-bottom b{font-size:16px;font-weight:400;color:#f97751}

<body><div class="archive-page">
<header class="archive-nav"><a class="archive-brand" href="./index.html"><svg class="archive-brand-mark" viewBox="0 0 38 38"><circle cx="19" cy="19" r="16"/><circle cx="19" cy="19" r="10"/><circle cx="19" cy="19" r="4"/><path d="M19 0v10M19 28v10M0 19h10M28 19h10"/></svg>MHIF.</a><a class="back-link" href="./index.html#observatory">← Back to portfolio</a></header>
<main class="archive-main"><p class="archive-eyebrow">MHIF / RECOGNITION DIRECTORY</p><div class="archive-heading-row"><h1>Awards &<br>acknowledgements<span style="color:#f97751">.</span></h1><p>A collection of appreciation letters and certificates related to responsible vulnerability reporting and security research contributions.</p></div><div class="archive-stats"><span>06 DOCUMENTS</span><span>2026 ARCHIVE</span><span>JPG / LETTERS / CERTIFICATES</span></div>
<div class="archive-grid" id="document-grid"></div></main></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Document preview"><div class="viewer-inner"><div class="viewer-top"><span id="viewer-count">DOCUMENT 01 / 06</span><button class="viewer-close" id="viewer-close" aria-label="Close preview">×</button></div><div class="viewer-image-wrap"><img id="viewer-image" alt=""></div><div class="viewer-bottom"><div><h2 id="viewer-title"></h2><p id="viewer-description"></p></div><div class="viewer-controls"><button id="viewer-prev" aria-label="Previous document">←</button><button id="viewer-next" aria-label="Next document">→</button></div></div></div></div>
<script>
const docs=[
{file:'drexel-letter.jpg',title:'Drexel University',kicker:'INTERNATIONAL UNIVERSITY',desc:'Letter of appreciation · Bug Bounty Program · August 2026',type:'LETTER'},
{file:'esdm-appreciation.jpg',title:'Ministry of Energy and Mineral Resources',kicker:'INDONESIAN GOVERNMENT',desc:'ESDM-CSIRT · Appreciation certificate · May 2026',type:'CERTIFICATE'},
{file:'ums-appreciation.jpg',title:'DRPPS UMS',kicker:'INDONESIAN UNIVERSITY',desc:'Appreciation for reporting a vulnerability in the UMS journal website · April 2026',type:'CERTIFICATE'},
{file:'purbalingga-csirt.jpg',title:'PurbalinggaKab-CSIRT',kicker:'GOVERNMENT CSIRT',desc:'Certificate of appreciation · Information security vulnerability report · 2026',type:'CERTIFICATE'},
{file:'bali-provincial-government.jpg',title:'Bali Provincial Government',kicker:'PROVINCIAL GOVERNMENT',desc:'Certificate of appreciation · Electronic system security contribution · June 2026',type:'CERTIFICATE'},
{file:'university-san-diego-letter.jpg',title:'University of San Diego',kicker:'INTERNATIONAL UNIVERSITY',desc:'Letter from Information Technology Services · July 2026',type:'LETTER'}];
const grid=document.getElementById('document-grid'),viewer=document.getElementById('viewer');let active=0;
docs.forEach((d,i)=>{const b=document.createElement('button');b.className='document-card';b.type='button';b.innerHTML=`<div class="document-preview"><span class="document-type">${d.type}</span><img src="./assets/${d.file}" alt="Preview of ${d.title} document" loading="lazy"></div><div class="document-info"><span class="document-kicker">${d.kicker}</span><h2>${d.title}</h2><p>${d.desc}</p></div><div class="document-bottom"><span>OPEN DOCUMENT</span><b>↗</b></div>`;b.addEventListener('click',()=>show(i));grid.appendChild(b)});
function show(i){active=(i+docs.length)%docs.length;const d=docs[active];document.getElementById('viewer-image').src='./assets/'+d.file;document.getElementById('viewer-image').alt=d.title;document.getElementById('viewer-title').textContent=d.title;document.getElementById('viewer-description').textContent=d.desc;document.getElementById('viewer-count').textContent=`DOCUMENT ${String(active+1).padStart(2,'0')} / ${String(docs.length).padStart(2,'0')}`;viewer.classList.add('is-open');document.body.style.overflow='hidden'}
function close(){viewer.classList.remove('is-open');document.body.style.overflow=''}
document.getElementById('viewer-close').addEventListener('click',close);document.getElementById('viewer-prev').addEventListener('click',()=>show(active-1));document.getElementById('viewer-next').addEventListener('click',()=>show(active+1));viewer.addEventListener('click',e=>{if(e.target===viewer)close()});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('is-open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1)});
</script></body></html>
